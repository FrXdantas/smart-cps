[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-jbmc"
version = "0.1.0"
description = "Plataforma de verificação formal (JBMC + ESBMC) com classificação CWE/CERT-C e reparo guiado por contraexemplo"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
